<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <title>Test della personalità</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .question-block { margin-bottom: 20px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .question-block p { margin: 0 0 8px; }
        .radio-group label { margin-right: 12px; }
        button { padding: 10px 18px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Test della personalità</h1>
    <p>Rispondi a tutte le domande scegliendo un valore da 1 a 7.</p>

    <form method="post" action="{% url 'personality_test' resume.id %}">
        {% csrf_token %}

        {% for domanda in domande %}
            <div class="question-block">
                <p><strong>{{ forloop.counter }}.</strong> {{ domanda.testo }}</p>
                <div class="radio-group">
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="1" required /> 1</label>
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="2" required /> 2</label>
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="3" required /> 3</label>
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="4" required /> 4</label>
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="5" required /> 5</label>
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="6" required /> 6</label>
                    <label><input type="radio" name="domanda_{{ forloop.counter }}" value="7" required /> 7</label>
                </div>
            </div>
        {% empty %}
            <p>Nessuna domanda di personalità disponibile.</p>
        {% endfor %}

        <button type="submit">Invia risposte</button>
    </form>
</body>
</html>
